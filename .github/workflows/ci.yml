name: CI

# Every push and pull request runs clippy and all tests, including the
# database tests, against a throwaway Postgres. On master:
# - every push that passes deploys testing;
# - release-please keeps a release PR open, and merging it tags a release and
#   deploys that version to production. This is the only way production
#   changes. Apps check production's version before they ship.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # sqlx::test creates and drops a database per test, so this user needs
      # to be allowed to create databases (the default superuser is).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test -- --include-ignored

  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-testing:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one.
    concurrency: deploy-testing
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy -c fly.test.toml --remote-only --env "MULSANNE_VERSION=testing-${GITHUB_SHA::7}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TESTING }}

  deploy-production:
    needs: [test, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy -c fly.toml --remote-only --env "MULSANNE_VERSION=${{ needs.release-please.outputs.version }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
